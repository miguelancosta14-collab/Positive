
<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <title>Momozinha</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./P.Dijha.css">
    </head>

    <!--Principal-->
    <body>
        <div style='text-align: center;'>
            <!--Foto-->
            <h1>Para meu amor...</h1>
            <figure>
                <img src="../Img/red-heart-bumping.gif" style="width: 170px;">
            </figure>

            <!--Frases-->
            <p>Quem voce ama?</p>
            <p id="EuAmo">EU AMO O <strong>MEU AMOR</strong></p>

            <button onclick='somar()'>
                Clique aqui para dar <strong>AMOR</strong> para <strong>MEU BEM</strong>
            </button>
            <p>Amores:</p>
            <h2 id="Amores">0</h2>

            <p>Para mais trabalhos:
                <a href="./NK.html" target="_blank">Clique aqui</a>
            </p>
        </div>
        <!--Contador-->
        <script>
            let contador = 0
            function somar(){
                contador = contador + 1;
                document.getElementById('Amores').innerText = contador;
            }        
        </script>
    </body>

</html>
