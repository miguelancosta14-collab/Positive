<!DOCTYPE html>
<html lang="pt-br">

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="RPGProtótipo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
</head>

<body>
    <div>
        <header class="Titulo">
            <div>
                <p>Player</p> 
                <p class="vid">100</p>
            </div>
            <div>
                <p>NPC</p>  
                <p class="vida" id="npc">80</p>
            </div>
        </header>
        <br><br><br><br>
        <button onclick="atk()">Atacar</button>
        <button>Itens</button>
        <button>Menu</button>
        <button>Sair</button>
    </div>
    <p id = 'mensagem'></p>

    <script>
        let dano = 20
        function atk(){
            let msg = document.getElementById('mensagem')
            let elemento = document.getElementById('npc')
            let vida = parseInt(elemento.textContent) 
            novovalor = vida - dano

            if (novovalor < 0){
                return
            }
            document.getElementById('npc').innerText= novovalor;

            if (novovalor === 0){
                msg.textContent = 'Vitória!!'
            }
        }
    </script>
</body>
</html>
